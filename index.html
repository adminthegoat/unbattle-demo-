
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unbattle — Telegram Gifts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07080f;--p1:#0f1220;--p2:#161a30;--ln:rgba(255,255,255,.07);--tx:#eef0ff;--mt:#8b91ad;--ac:#7c5cff;--ac2:#22d3ee;--pk:#ff4d8d;--gr:#2ee59d;--rd:#ff4d5e;--gd:#ffc24d}
html,body{color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100%;font-size:15px}
body{background:radial-gradient(900px 520px at 8% -10%,rgba(124,92,255,.28),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(34,211,238,.15),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit;outline:0}
a{color:inherit;text-decoration:none}
.ic{flex:none;display:block}.mt{color:var(--mt)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;font-weight:500}
.r-c{--rc:#9aa4b8}.r-u{--rc:#4ade80}.r-r{--rc:#3b82f6}.r-e{--rc:#a855f7}.r-l{--rc:#fbbf24}.r-m{--rc:#ff4d5e}

/* header */
.top{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:rgba(9,10,18,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.tnav{display:flex;gap:4px;align-items:center;flex:1}
.tnav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;color:var(--mt);font-weight:600;transition:.2s}
.tnav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.tnav a.on{color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.12));box-shadow:inset 0 0 0 1px rgba(124,92,255,.4)}
.tnav a.brand{font-family:Unbounded;font-weight:800;color:#fff;font-size:16px;margin-right:6px}
.tnav .sep{width:1px;height:20px;background:var(--ln);margin:0 4px}
.tr{display:flex;gap:10px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mt)}
.iconbtn:hover{color:#fff}
.bal{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--p2);border:1px solid var(--ln);font-weight:800;font-size:16px}
.bal i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.avatar{position:relative;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pk),var(--ac));display:grid;place-items:center;font-weight:800}
.avatar b{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:8px;background:var(--gd);color:#2b1c00;font-size:11px;display:grid;place-items:center}
.mbrand{display:none}

/* layout */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}
#feed{position:sticky;top:64px;height:calc(100vh - 64px);padding:16px 12px;border-right:1px solid var(--ln);overflow:hidden;background:rgba(10,11,20,.5)}
.fh{display:flex;align-items:center;gap:8px;font-weight:800;margin:0 6px 12px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mt)}
.live{width:8px;height:8px;border-radius:50%;background:var(--gr);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,229,157,.7)}70%,100%{box-shadow:0 0 0 8px rgba(46,229,157,0)}}
.fi{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:14px;background:var(--p1);border:1px solid var(--ln);border-left:3px solid var(--rc)}
.fi.new{animation:slidein .5s}
.fi.mine{background:linear-gradient(90deg,rgba(124,92,255,.22),var(--p1))}
@keyframes slidein{from{opacity:0;transform:translateY(-16px) scale(.96)}}
.fi .gift{width:40px;flex:none}
.fm{min-width:0;flex:1;display:flex;flex-direction:column}
.fm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm span{font-size:11px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi em{font-style:normal;font-weight:800;font-size:12px;color:var(--rc)}
#ticker{display:none}
main{padding:24px;min-width:0;max-width:1240px;width:100%;margin:0 auto}
.bottom{display:none}
.foot{margin-top:40px;padding:20px 0;color:var(--mt);font-size:12px;border-top:1px solid var(--ln);text-align:center;line-height:1.5}

/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;background:var(--p2);border:1px solid var(--ln);font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.2)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#5b8cff 60%,var(--ac2));border:0;box-shadow:0 8px 28px -8px var(--ac)}
.btn.gr{background:linear-gradient(135deg,#17b978,var(--gr));color:#04180f;border:0}
.btn.rd{background:linear-gradient(135deg,#d62c49,var(--rd));border:0}
.btn.big{padding:16px 26px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.pn{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:22px;padding:18px}
.sec{font-size:20px;font-weight:800;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h1{font-family:Unbounded;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(124,92,255,.15);border:1px solid rgba(124,92,255,.4);font-size:12px;font-weight:700;color:#c9bcff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:10px;background:var(--p1);border:1px solid var(--ln);font-weight:700;font-size:13px;color:var(--mt)}
.chips button.on{background:linear-gradient(135deg,var(--ac),#5b8cff);color:#fff;border-color:transparent}
.tabs{display:flex;gap:4px;padding:4px;background:var(--p1);border-radius:14px;border:1px solid var(--ln)}
.tabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--mt)}
.tabs button.on{background:var(--p2);color:#fff;box-shadow:inset 0 0 0 1px var(--ln)}
input[type=number],input[type=text],select{width:100%;padding:12px 14px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);transition:.2s}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mt);font-weight:600;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.xpbar{height:8px;border-radius:5px;background:var(--p1);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}

/* gifts */
.gift{position:relative;aspect-ratio:1;display:grid;place-items:center;width:100%}
.gift::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 55%,transparent),transparent 70%);filter:blur(5px)}
.gift svg{position:relative;width:76%;height:76%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.ic2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 14%,var(--p1)),var(--p1));border:1px solid color-mix(in srgb,var(--rc) 30%,transparent);position:relative;text-align:center;transition:.2s}
.ic2 .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ic2 .pr{font-weight:800;color:var(--rc);font-size:13px}
.ic2 .tg{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.45)}
.ic2 .tg.r{left:auto;right:6px;color:var(--gr)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.igrid.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.mi{cursor:pointer}.mi:hover{transform:translateY(-3px)}
.mi.sel{box-shadow:0 0 0 2px var(--ac),0 10px 30px -10px var(--ac);background:linear-gradient(180deg,rgba(124,92,255,.3),var(--p1))}
.mi.dis{opacity:.35;pointer-events:none}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:40px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.12) 60%,rgba(255,77,141,.18));border:1px solid rgba(255,255,255,.1)}
.hero h1{font-size:clamp(26px,3.4vw,44px);line-height:1.12;margin:16px 0}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac2),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c3c8e6;max-width:480px;margin-bottom:22px;line-height:1.5}
.hero-r{position:relative;min-height:260px}
.hero-r .gift{position:absolute;width:34%;animation:flo 5s ease-in-out infinite}
.hero-r .gift:nth-child(1){left:6%;top:10%}.hero-r .gift:nth-child(2){left:36%;top:0;width:42%;animation-delay:-1s}.hero-r .gift:nth-child(3){right:2%;top:22%;animation-delay:-2s}.hero-r .gift:nth-child(4){left:20%;top:52%;width:30%;animation-delay:-3s}.hero-r .gift:nth-child(5){right:12%;top:60%;width:28%;animation-delay:-4s}
@keyframes flo{50%{transform:translateY(-14px) rotate(4deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{padding:16px;border-radius:18px;background:var(--p1);border:1px solid var(--ln)}
.stat b{display:block;font-size:22px;font-family:Unbounded;font-weight:600}
.stat span{font-size:12px;color:var(--mt)}
.bonus{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-top:14px;padding:18px 22px;border-radius:20px;background:linear-gradient(90deg,rgba(255,194,77,.16),var(--p1));border:1px solid rgba(255,194,77,.3)}
.lbr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--p1);margin-bottom:6px}
.lbr .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--p2);font-size:13px}
.lbr:nth-child(1) .n{background:var(--gd);color:#2b1c00}.lbr b{flex:1}.lbr span{color:var(--gr);font-weight:800}

/* cases */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ccard{position:relative;display:flex;flex-direction:column;align-items:center;padding:16px 14px 18px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 22%,var(--p1)),var(--p1) 70%);border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);transition:.25s}
.ccard:hover{transform:translateY(-6px);box-shadow:0 22px 40px -18px var(--cc)}
.cbadge{position:absolute;top:12px;left:12px;z-index:3;padding:4px 9px;border-radius:9px;font-size:11px;font-weight:800;background:var(--cc);color:#fff}
.cglow{position:absolute;width:200px;height:200px;border-radius:50%;background:var(--cc);opacity:.25;filter:blur(50px);top:20px}
.cpeek{position:relative;display:flex;width:100%;justify-content:center;margin-bottom:-26px;z-index:1}
.cpeek .gift{width:34%;margin:0 -5%}.cpeek .gift:nth-child(2){transform:translateY(-12px);z-index:2}
.cpeek .gift:nth-child(1){transform:rotate(-12deg)}.cpeek .gift:nth-child(3){transform:rotate(12deg)}
.cart{position:relative;width:70%;transition:.3s}
.ccard:hover .cart{transform:scale(1.08) translateY(-4px)}
.ccard h3{position:relative;margin-top:6px;font-size:17px}
.cprice{position:relative;margin-top:8px;padding:7px 18px;border-radius:12px;font-weight:800;background:rgba(0,0,0,.35);border:1px solid var(--ln)}
.back{display:inline-flex;gap:6px;color:var(--mt);font-weight:600;margin-bottom:14px}
.cd-top{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px}
.cd-art{width:200px;filter:drop-shadow(0 20px 30px var(--cc))}
.cdet h1{font-size:28px;margin-bottom:10px}
.qty{display:flex;gap:6px;margin:16px 0}
.qty button{padding:9px 18px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font-weight:800}
.qty button.on{background:var(--cc);color:#fff;border-color:transparent}
.tgl{display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;margin:0 0 14px;cursor:pointer}
.tgl input{width:18px;height:18px;accent-color:var(--ac)}
#reels{display:flex;flex-direction:column;gap:10px;margin:10px 0 0}
.reel{position:relative;overflow:hidden;border-radius:20px;background:var(--p1);border:1px solid var(--ln);padding:14px 0}
.reel::before,.reel::after{content:'';position:absolute;top:0;bottom:0;width:20%;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}.reel::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.track{display:flex;gap:8px;position:relative;width:max-content;padding:0 8px;will-change:transform}
.rc{width:124px;flex:none;padding:8px 6px;border-radius:14px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 20%,var(--p1)),var(--p1));border-bottom:3px solid var(--rc);transition:.4s}
.rc span{font-size:12px;font-weight:800;color:var(--rc)}
.rc.hit{transform:scale(1.08);box-shadow:0 0 30px -4px var(--rc)}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(var(--gd),transparent 5%,transparent 95%,var(--gd));z-index:3;box-shadow:0 0 14px var(--gd)}

/* upgrader */
.stage{display:grid;grid-template-columns:1fr minmax(270px,340px) 1fr;gap:16px;align-items:stretch}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:300px;position:relative;overflow:hidden}
.slot.empty{border:2px dashed rgba(255,255,255,.14);background:transparent}
.slot .gift{width:62%;max-width:190px}
.slot h4{font-size:16px}.slot .pv{font-weight:800;font-size:20px;color:var(--rc,var(--gd))}
.slot .lbl{position:absolute;top:12px;left:14px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mt);text-transform:uppercase}
.slot .plus{position:absolute;top:10px;right:12px;padding:3px 8px;border-radius:8px;background:var(--ac);font-weight:800;font-size:12px}
.slot.win{animation:winf 1.4s}.slot.lose{animation:losef 1s}
@keyframes winf{0%,60%{box-shadow:0 0 60px 8px var(--gr)}}
@keyframes losef{0%,50%{box-shadow:0 0 50px 4px var(--rd)}}
.coinb{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffe08a,#e6a417 70%);color:#5a3b00;font-size:44px;font-weight:800;box-shadow:0 10px 30px -6px rgba(255,194,77,.6)}
.ctr{display:flex;flex-direction:column;gap:12px;padding:14px}
.sq{position:relative;aspect-ratio:1;border-radius:20px;background:radial-gradient(circle,rgba(124,92,255,.18),transparent 70%),var(--p1);border:1px solid var(--ln)}
.ring{position:absolute;inset:6%;width:88%;height:88%}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:rgba(255,77,94,.28)}.ring .win{stroke:var(--gr);filter:drop-shadow(0 0 6px var(--gr));transition:stroke-dasharray .4s}
.pt{position:absolute;inset:0;pointer-events:none}
.pt::before{content:'';position:absolute;left:50%;top:1.5%;margin-left:-9px;border:9px solid transparent;border-top:16px solid #fff;filter:drop-shadow(0 0 6px #fff)}
.pt::after{content:'';position:absolute;left:50%;top:9%;width:2px;height:34%;margin-left:-1px;background:linear-gradient(#fff,transparent)}
.cen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cen b{font-family:Unbounded;font-size:clamp(28px,4vw,40px)}
.cen span{color:var(--mt);font-weight:700}
.cen.w b{color:var(--gr)}.cen.l b{color:var(--rd)}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.lower .pn{min-height:340px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.scr{max-height:360px;overflow:auto;padding:2px}
.scr::-webkit-scrollbar{width:6px}.scr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
.empty-m{padding:40px 10px;text-align:center;color:var(--mt)}

/* pvp / hub */
.arena{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;margin-top:16px;align-items:start}
.side{padding:14px}.side .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.side .ph .avatar{width:40px;height:40px;border-radius:12px;font-size:14px}.side .tot{margin-left:auto;font-weight:800;font-size:20px;color:var(--gd)}
.side.lead{box-shadow:0 0 0 2px var(--gr)}
.vs{align-self:center;text-align:center;font-family:Unbounded;font-weight:800;font-size:20px;color:var(--mt)}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:10px}
.drops .gift{animation:slidein .4s}
.lob{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--p1);border:1px solid var(--ln);margin-bottom:8px}
.lob .cs{width:46px}.lob .in{flex:1;min-width:0}.lob .in b{display:block}.lob .in span{font-size:12px;color:var(--mt)}
.hubtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.hubtabs button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:20px;background:var(--p1);border:1px solid var(--ln);text-align:left;transition:.2s}
.hubtabs button.on{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.12));border-color:var(--ac)}
.hubtabs b{font-size:17px}.hubtabs span{font-size:12px;color:var(--mt)}
.bet .bi{display:flex;gap:6px}.bet .bi input{flex:1}.bet .bi button{padding:0 14px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font-weight:800}
.gm{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.coinwrap{perspective:700px;display:grid;place-items:center;min-height:240px}
.coin{width:160px;height:160px;position:relative;transform-style:preserve-3d;transition:transform 2.4s cubic-bezier(.2,.7,.2,1)}
.coin>div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;border:6px solid #ffe08a;box-shadow:inset 0 0 30px rgba(0,0,0,.3),0 12px 30px -8px rgba(255,194,77,.6)}
.coin .a{background:radial-gradient(circle at 30% 30%,#6f55ff,#2b1c8a)}.coin .b{background:radial-gradient(circle at 30% 30%,#ff7ab0,#9b1d55);transform:rotateY(180deg)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sides button{padding:12px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font-weight:800}
.sides button.on{background:var(--ac);border-color:transparent}
.dnum{font-family:Unbounded;font-size:64px;text-align:center;font-weight:800}
.dbar{position:relative;height:16px;border-radius:9px;background:var(--rd);overflow:hidden;margin:14px 0}
.dbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.dbar u{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 10px #fff;transition:left .5s}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:auto;width:100%}
.tile{aspect-ratio:1;border-radius:14px;background:var(--p1);border:1px solid var(--ln);display:grid;place-items:center;transition:.2s}
.tile:hover:not(.o){background:var(--p2);transform:translateY(-2px)}
.tile.g{background:rgba(46,229,157,.15);border-color:var(--gr)}.tile.m{background:rgba(255,77,94,.2);border-color:var(--rd)}.tile.o{opacity:.5}.tile.g,.tile.m{opacity:1}
.tile svg{width:60%;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}}

 .bonus{flex-direction:column;align-items:flex-start}

function sha256(ascii){
 const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mp=Math.pow,mw=mp(2,32);let result='';
 const words=[],bl=ascii.length*8;let hash=[],k=[],pc=0;const comp={};

 for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}

 for(let j=0;j<words.length;){

   const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];

   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}

 for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result}

 const v=+$('#dsl').value,r=fr()*100,win=r<v,tk=TOKEN;if(win)S.bal+=b*96/v;save();

let CR={on:false};
function gCrash(){CR={on:false,m:1};$('#game').innerHTML=`<div class="gm"><div class="crwrap"><canvas id="crc" width="520" height="300"></canvas><div class="crn" id="crn">1.00x</div></div>
 <div>${betBox('crb',1)}<label>Авто-вывод, x</label><input type="number" id="cra" value="2" min="1.1" step="0.1"><div class="mt" id="crinfo" style="margin:12px 0;font-size:13px;line-height:1.5">Множитель растёт, пока не взорвётся. Успей нажать «Забрать» или задай авто-вывод. RTP 96%.</div><button class="btn pri big" style="width:100%" id="crgo" onclick="crashGo()">Сделать ставку</button></div></div>`;crashDraw()}
function crashGo(){if(CR.on){crashCash();return}if(BUSY)return;const b=getBet('crb');if(!b)return;const au=+$('#cra').value;
 S.bal-=b;addXp(b);save();updateBal();BUSY=true;
 const r=fr(),cp=Math.min(500,Math.max(1,Math.floor(96/(1-r))/100));
 CR={on:true,b,cp,auto:au>=1.01?au:0,t0:performance.now(),m:1};LEAVE.push(()=>{if(CR.on)crashCash(true)});
 $('#crgo').textContent='Забрать';$('#crgo').className='btn gr big';$('#crinfo').textContent='Игра идёт…';$('#crn').style.color='#fff';requestAnimationFrame(crashFrame)}
function crashFrame(){const c=CR;if(!c.on)return;
 const m=Math.floor(Math.exp(.15*(performance.now()-c.t0)/1000)*100)/100;
 if(m>=c.cp){c.m=c.cp;c.on=false;BUSY=false;crashDraw(true);sfx.lose();const e=$('#crn');if(e){e.textContent=c.cp.toFixed(2)+'x';e.style.color='var(--rd)'}const g=$('#crgo');if(g){g.textContent='Сделать ставку';g.className='btn pri big'}const i=$('#crinfo');if(i)i.textContent='Взрыв на x'+c.cp.toFixed(2)+'. Ставка проиграна.';toast('Crash x'+c.cp.toFixed(2),'err');return}
 c.m=m;if(c.auto&&m>=c.auto){c.m=c.auto;crashCash();return}
 const e=$('#crn');if(e)e.textContent=m.toFixed(2)+'x';crashDraw();requestAnimationFrame(crashFrame)}
function crashCash(silent){const c=CR;if(!c.on)return;c.on=false;BUSY=false;const w=c.b*c.m;S.bal+=w;save();updateBal();
 if(silent){toast('Crash завершён, выигрыш '+money(w)+' зачислен','ok');return}
 sfx.win();crashDraw();const e=$('#crn');if(e){e.textContent=c.m.toFixed(2)+'x';e.style.color='var(--gr)'}const g=$('#crgo');if(g){g.textContent='Сделать ставку';g.className='btn pri big'}const i=$('#crinfo');if(i)i.textContent='Забрано на x'+c.m.toFixed(2)+' · '+money(w);toast('Выигрыш '+money(w),'ok')}
function crashDraw(dead){const cv=$('#crc');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);
 x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}
 const m=CR.m||1;if(m<=1.001&&!dead)return;
 const cs=Math.log(m)/.15,xr=Math.max(6,cs*1.1),yr=Math.max(2,m*1.15),N=80,col=dead?'#ff4d5e':'#2ee59d';
 const pt=i=>{const s=cs*i/N;return [10+s/xr*(W-20),H-10-(.15*s/Math.log(yr))*(H-20)]};
 x.beginPath();for(let i=0;i<=N;i++){const [px,py]=pt(i);i?x.lineTo(px,py):x.moveTo(px,py)}
 x.strokeStyle=col;x.lineWidth=4;x.lineJoin='round';x.shadowColor=col;x.shadowBlur=14;x.stroke();x.shadowBlur=0;
 const [ex,ey]=pt(N);x.lineTo(ex,H);x.lineTo(10,H);x.closePath();x.fillStyle=dead?'rgba(255,77,94,.12)':'rgba(46,229,157,.12)';x.fill();
 x.beginPath();x.arc(ex,ey,6,0,7);x.fillStyle='#fff';x.fill()}

function openFair(){modal('<div id="frm"></div>','wide');drawFair()}
function drawFair(){const f=S.fair,e=$('#frm');if(!e)return;
 e.innerHTML=`<div class="wh"><h2>Provably Fair</h2></div>
 <p class="mt" style="font-size:13px;line-height:1.5">Каждый результат = SHA-256(серверный сид : клиентский сид : nonce), первые 52 бита → число от 0 до 1. Хэш серверного сида показан заранее. После смены сида ты видишь старый и можешь проверить все прошлые игры.</p>
 <div class="kv"><span>Хэш серверного сида</span><b class="mono">${sha256(f.server)}</b></div>
 <label>Клиентский сид</label><div class="bet"><div class="bi"><input type="text" id="fcs" value="${esc(f.client)}" maxlength="32"><button onclick="setClient()">Сохранить</button></div></div>
 ${kv('Nonce (сделано ставок)',f.nonce)}
 <button class="btn" style="margin-top:12px" onclick="rotateSeed()">Сменить серверный сид</button>
 ${f.hist.length?`<h3 style="margin-top:18px">Раскрытые серверные сиды</h3>${f.hist.map(h=>`<div class="kv"><span>nonce ${h.nonce}</span><b class="mono">${h.server}</b></div>`).join('')}`:''}
 <h3 style="margin-top:18px">Проверка результата</h3>
 <label>Серверный сид</label><input type="text" id="vs"><label>Клиентский сид</label><input type="text" id="vc"><label>Nonce</label><input type="number" id="vn" value="0" min="0">
 <button class="btn pri" style="margin-top:12px;width:100%" onclick="verifyFair()">Проверить</button><div id="vr" class="mono" style="margin-top:12px;line-height:1.6"></div>
 <div class="demo-note">В демо сиды хранятся в браузере. В боевой версии серверный сид хранится только на сервере, а результаты считаются там же.</div>`}
function setClient(){const v=$('#fcs').value.replace(/[^\x20-\x7e]/g,'').trim();if(!v)return toast('Введи сид','err');S.fair.client=v;save();toast('Клиентский сид сохранён','ok');drawFair()}
function rotateSeed(){const f=S.fair;f.hist.unshift({server:f.server,nonce:f.nonce});f.hist=f.hist.slice(0,5);f.server=newSeed();f.nonce=0;save();toast('Серверный сид обновлён','ok');drawFair()}
function verifyFair(){const s=$('#vs').value.trim(),c=$('#vc').value.trim(),n=+$('#vn').value||0,h=sha256(`${s}:${c}:${n}`);if(!h||!s||!c){$('#vr').textContent='Заполни сиды (только ASCII)';return}
 const v=parseInt(h.slice(0,13),16)/Math.pow(16,13);$('#vr').innerHTML=`Хэш: ${h}<br>Число: ${v.toFixed(10)}<br>Upgrader / Dice: ${(v*100).toFixed(2)}<br>Coinflip: ${v<.49?'победа':'проигрыш'}`}

function genAddr(k){const r=(s,n)=>Array.from({length:n},()=>s[ri(0,s.length-1)]).join(''),b58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
 return {usdt_trc:()=>'T'+r(b58,33),usdt_ton:()=>'UQ'+r(b58+'_-',46),ton:()=>'UQ'+r(b58+'_-',46),btc:()=>'bc1q'+r('acdefghjklmnpqrstuvwxyz023456789',38),eth:()=>'0x'+r('0123456789abcdef',40),ltc:()=>'ltc1q'+r('acdefghjklmnpqrstuvwxyz023456789',38)}[k]()}
function qr(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;h|=1;
 const R=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296},N=25;
 const fin=(x,y)=>{for(const [cx,cy] of [[0,0],[N-7,0],[0,N-7]]){if(x>=cx-1&&x<=cx+7&&y>=cy-1&&y<=cy+7){const dx=x-cx,dy=y-cy;if(dx<0||dy<0||dx>6||dy>6)return 0;const d=Math.max(Math.abs(dx-3),Math.abs(dy-3));return d===3||d<=1?1:0}}return -1};
 let o='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=fin(x,y);if(v<0)v=R()>.5?1:0;if(v)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" fill="#0b0d1a">${o}</svg>`}

 if(m==='sbp'){v.bank=$('#bank').value;v.phone=`+7 9${ri(10,99)} ${ri(100,999)}-${ri(10,99)}-${ri(10,99)}`;v.name=['Алексей К.','Дмитрий П.','Мария С.','Игорь В.'][ri(0,3)];v.rub=Math.round(usd*RUB)}
 if(m==='card'){v.card=`2200 ${ri(1000,9999)} ${ri(1000,9999)} ${ri(1000,9999)}`;v.name='IVAN IVANOV';v.rub=Math.round(usd*RUB)}
 if(m==='gift'){v.to='@unbattle_gifts';v.g=W.g}
 W.inv=v;drawWallet()}
function wInvoice(){const v=W.inv,c=$('#wc');if(!c||!v)return;clearInterval(W.timer);const m=MT[v.m];let rows='';
 if(m.k==='crypto')rows=kv('Сеть',`${m.t} · ${m.s}`)+kv('Сумма к отправке',`${v.amt} ${m.sym}`,v.amt)+kv('Адрес',`<span class="mono">${v.addr}</span>`,v.addr);
 else if(v.m==='sbp')rows=kv('Получатель',v.name)+kv('Телефон (СБП)',v.phone,v.phone.replace(/\D/g,''))+kv('Банк получателя',v.bank)+kv('Сумма',`${v.rub.toLocaleString('ru-RU')} ₽`,v.rub)+kv('Комментарий',v.code,v.code);
 else if(v.m==='card')rows=kv('Номер карты',v.card,v.card.replace(/\s/g,''))+kv('Держатель',v.name)+kv('Сумма',`${v.rub.toLocaleString('ru-RU')} ₽`,v.rub)+kv('Комментарий',v.code,v.code);
 else rows=kv('Отправь подарок',`<span style="color:var(--ac2)">${v.to}</span>`,v.to)+kv('Подарок',G[v.g].n)+kv('Ценность',money(v.usd))+kv('Memo',v.code,v.code);
 const done=v.st==='ok';
 c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><h3>Счёт #${v.id}</h3><span class="st ${done?'ok':'pe'}">${done?'Зачислен':v.st==='check'?'Проверка':'Ожидает оплаты'}</span></div>
 ${done?`<div style="text-align:center;padding:26px 0"><div class="mic" style="margin:auto;width:70px;height:70px;background:var(--gr);color:#04180f">${ic('check',36)}</div><h2 style="margin:14px 0 4px">${m.k==='gift'?'Подарок получен':'Баланс пополнен'}</h2><div class="wbal" style="font-size:28px">+${money(v.usd+v.bonus)}</div>${v.bonus?`<div class="mt" style="margin-top:4px">включая бонус ${money(v.bonus)}</div>`:''}<button class="btn pri" style="margin-top:18px" onclick="W.inv=null;W.m=null;drawWallet()">Готово</button></div>`:`
 <div class="inv-top">${m.k==='crypto'?`<div class="qr">${qr(v.addr)}</div>`:''}<div style="flex:1;min-width:0">${kv('К зачислению',money(v.usd)+(v.bonus?` + бонус ${money(v.bonus)}`:''))}${kv('Срок счёта','<span id="tm" style="color:var(--gd)">30:00</span>')}${m.k==='crypto'?'<div class="mt" style="font-size:11px;margin-top:6px">Отсканируйте QR</div>':''}</div></div>${rows}
 ${v.steps.length?`<div class="steps">${v.steps.map(s=>`<div>${ic('check',18)}${s}</div>`).join('')}${v.st==='check'?`<div style="background:var(--p1);color:var(--mt)"><span class="spin"></span>Ожидание…</div>`:''}</div>`:''}
 <button class="btn gr big" style="width:100%;margin-top:14px" ${v.st!=='wait'?'disabled':''} onclick="payCheck()">${ic('check',20)} Я оплатил</button>
 <button class="btn" style="width:100%;margin-top:8px" ${v.st!=='wait'?'disabled':''} onclick="W.inv=null;W.m=null;drawWallet()">Отменить счёт</button>`}`;
 if(!done)W.timer=setInterval(()=>{const e=$('#tm');if(!e)return clearInterval(W.timer);const l=Math.max(0,v.exp-Date.now());e.textContent=`${String(Math.floor(l/6e4)).padStart(2,'0')}:${String(Math.floor(l%6e4/1e3)).padStart(2,'0')}`},1000)}
async function payCheck(){const v=W.inv;if(!v||v.st!=='wait')return;v.st='check';wInvoice();const m=MT[v.m];
 const steps=m.k==='crypto'?['Транзакция найдена в сети','Подтверждение 1/3','Подтверждение 2/3','Подтверждение 3/3']:m.k==='gift'?['Подарок получен','Подлинность подтверждена']:['Платёж найден','Банк подтвердил перевод'];
 for(const s of steps){await sleep(1000);v.steps.push(s);if(W.inv===v)wInvoice()}
 await sleep(500);v.st='ok';
 if(v.m==='gift')addItem(v.g);else S.bal+=v.usd+v.bonus;
 S.tx.unshift({id:v.id,type:'dep',m:v.m,usd:v.usd+v.bonus,st:'ok',ts:Date.now(),d:m.k==='gift'?G[v.g].n:m.t+' '+m.s});save();updateBal();sfx.win();toast('Пополнение '+money(v.usd+v.bonus)+' зачислено','ok');if(W.inv===v)wInvoice()}
/* withdraw */
function wWd(){const c=$('#wc');if(!W.m){c.innerHTML=`<h3 style="margin-top:6px">Выбери способ вывода</h3>`+mGrid('pickW');return}wWdForm()}
function pickW(k){W.m=k;drawWallet()}
function wWdForm(){const m=MT[W.m],c=$('#wc');
 if(W.m==='gift'){const inv=[...S.inv].sort((a,b)=>G[b.id].p-G[a.id].p);W.sel=W.sel.filter(u=>S.inv.some(x=>x.u===u));
  c.innerHTML=bkBtn+`<h3>Вывод подарков в Telegram</h3>${inv.length?`<div class="scr" style="margin:12px 0"><div class="igrid sm">${inv.map(o=>icard(G[o.id],{cls:'mi'+(W.sel.includes(o.u)?' sel':''),attr:`onclick="togW('${o.u}')"`})).join('')}</div></div><label>Telegram username получателя</label><input type="text" id="wtg" placeholder="@username"><div class="kv"><span>Выбрано</span><b>${W.sel.length} шт · ${money(W.sel.reduce((s,u)=>s+invVal(u),0))}</b></div><button class="btn pri big" style="width:100%;margin-top:12px" onclick="submitWd()">Вывести подарки</button>`:`<div class="empty-m">В инвентаре нет подарков</div>`}`;return}
 c.innerHTML=bkBtn+`<div style="display:flex;gap:12px;align-items:center">${mIcon(W.m)}<h3>${m.t} <small class="mt">${m.s}</small></h3></div>
 <label>Сумма вывода, $ <span style="float:right;text-transform:none">Доступно: ${money(S.bal)}</span></label><input type="number" id="wamt" min="${m.min}" value="${Math.min(Math.max(m.min,10),Math.max(S.bal,m.min)).toFixed(2)}" oninput="updWd()"><div class="chips" style="margin-top:8px"><button onclick="$('#wamt').value=${m.min};updWd()">MIN</button><button onclick="$('#wamt').value=(S.bal*.5).toFixed(2);updWd()">50%</button><button onclick="$('#wamt').value=S.bal.toFixed(2);updWd()">MAX</button></div>
 ${m.k==='crypto'?`<label>Адрес кошелька (${m.s})</label><input type="text" id="wad" placeholder="${m.ph}" autocomplete="off">`:W.m==='sbp'?`<label>Телефон получателя</label><input type="text" id="wph" placeholder="+7 900 000-00-00"><label>Банк</label><select id="wbk">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select>`:`<label>Номер карты</label><input type="text" id="wcd" placeholder="0000 0000 0000 0000" maxlength="19" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g,'$1 ').trim()">`}
 <div id="wsum" style="margin:14px 0;padding:12px;border-radius:14px;background:var(--p1)"></div><button class="btn pri big" style="width:100%" onclick="submitWd()">Запросить вывод</button>`;updWd()}
function togW(u){const i=W.sel.indexOf(u);i>=0?W.sel.splice(i,1):W.sel.push(u);const t=$('#wtg')?.value;wWdForm();if(t)$('#wtg').value=t}
const feeOf=(k,v)=>MT[k].k==='crypto'?MT[k].fee:Math.max(.3,v*MT[k].fee);
function updWd(){const m=MT[W.m],v=+$('#wamt').value||0,f=feeOf(W.m,v),r=Math.max(0,v-f),e=$('#wsum');if(!e)return;
 e.innerHTML=kv('Комиссия',money(f))+kv('Вы получите',m.k==='fiat'?`${Math.round(r*RUB).toLocaleString('ru-RU')} ₽`:`${amtFmt(r/m.price,m.dec)} ${m.sym}`)}
const luhn=s=>{let t=0,a=false;for(let i=s.length-1;i>=0;i--){let d=+s[i];if(a){d*=2;if(d>9)d-=9}t+=d;a=!a}return t%10===0};
function submitWd(){const k=W.m,m=MT[k];let usd,d,id='W'+ri(100000,999999);
 if(k==='gift'){const u=($('#wtg').value||'').trim();if(!W.sel.length)return toast('Выбери подарки','err');if(!/^@?[A-Za-z0-9_]{5,32}$/.test(u))return toast('Некорректный username Telegram','err');
  usd=W.sel.reduce((s,x)=>s+invVal(x),0);d=`${W.sel.length} подарк. → ${u.startsWith('@')?u:'@'+u}`;W.sel.forEach(x=>{const i=S.inv.findIndex(y=>y.u===x);if(i>=0)S.inv.splice(i,1)});W.sel=[]}
 else{usd=Math.round((+$('#wamt').value)*100)/100;if(!(usd>=m.min))return toast('Минимум для вывода '+money(m.min),'err');if(usd>S.bal+1e-9)return toast('Недостаточно средств','err');if(usd-feeOf(k,usd)<=0)return toast('Сумма меньше комиссии','err');
  if(m.k==='crypto'){const a=$('#wad').value.trim();if(!m.re.test(a))return toast('Неверный адрес для сети '+m.s,'err');d=a.slice(0,8)+'…'+a.slice(-6)}
  else if(k==='sbp'){const p=$('#wph').value.replace(/\D/g,'');if(!/^[78]\d{10}$/.test(p))return toast('Неверный номер телефона','err');d=`+7${p.slice(-10)} · ${$('#wbk').value}`}
  else{const n=$('#wcd').value.replace(/\s/g,'');if(n.length!==16||!luhn(n))return toast('Неверный номер карты','err');d='•••• '+n.slice(-4)}
  S.bal-=usd}
 S.tx.unshift({id,type:'wd',m:k,usd,st:'pe',ts:Date.now(),d:(k==='gift'?'':m.t+' · ')+d});save();updateBal();toast('Заявка на вывод создана','ok');setTimeout(()=>doneTx(id),ri(6000,10000));W.tab='hist';W.m=null;drawWallet()}
function doneTx(id){const t=S.tx.find(x=>x.id===id);if(t&&t.st==='pe'){t.st='ok';save();toast('Вывод '+money(t.usd)+' выполнен','ok');if($('#wb')&&W.tab==='hist')drawWallet()}}
function wHist(){const c=$('#wc');c.innerHTML=S.tx.length?`<div class="scr" style="margin-top:12px;max-height:380px">${S.tx.map(t=>`<div class="tx">${mIcon(t.m,38)}<div class="in"><b>${t.type==='dep'?'Пополнение':'Вывод'}</b><small>${esc(t.d)} · ${new Date(t.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><div style="text-align:right"><b style="color:${t.type==='dep'?'var(--gr)':'#fff'}">${t.type==='dep'?'+':'−'}${money(t.usd)}</b><br><span class="st ${t.st}">${t.st==='ok'?'Выполнено':'В обработке'}</span></div></div>`).join('')}</div>`:`<div class="empty-m">Операций пока нет</div>`}

/* ================= PROFILE ================= */
let PS=[];
function openProfile(){PS=[];modal('<div id="pf"></div>','wide');drawProfile()}
function drawProfile(){const p=$('#pf');if(!p)return;const inv=[...S.inv].sort((a,b)=>G[b.id].p-G[a.id].p),tv=inv.reduce((s,o)=>s+G[o.id].p,0),L=lvlInfo();
 p.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><div class="avatar" style="width:60px;height:60px;font-size:24px;border-radius:18px">${esc(S.name[0])}<b>${L.L}</b></div><div style="flex:1"><h2>${esc(S.name)}</h2><span class="mt">ID ${S.id} · уровень ${L.L}</span><div class="xpbar"><i style="width:${L.p}%"></i></div></div></div>
 <div class="pstats"><div><b>${S.st.o}</b><span>Кейсов</span></div><div><b>${S.st.u}</b><span>Апгрейдов</span></div><div><b>${S.st.w}</b><span>Побед</span></div></div>
 <div class="row" style="margin-bottom:6px"><button class="btn pri" onclick="openWallet('dep')">${ic('plus',18)} Пополнить</button><button class="btn" onclick="openWallet('wd')">${ic('out',18)} Вывести</button><button class="btn" onclick="openFair()">${ic('shield',18)} Fair</button></div>
 <div class="ph2" style="margin-top:18px"><b style="font-size:17px">Инвентарь · ${inv.length} шт · ${money(tv)}</b></div>
 ${inv.length?`<div class="scr" style="max-height:300px"><div class="igrid sm">${inv.map(o=>icard(G[o.id],{cls:'mi'+(PS.includes(o.u)?' sel':''),attr:`onclick="togP('${o.u}')"`})).join('')}</div></div>
 <div class="row" style="margin-top:12px"><button class="btn gr sm" onclick="sellUids(PS.length?PS:S.inv.map(x=>x.u));PS=[];drawProfile()">${PS.length?'Продать выбранное · '+money(PS.reduce((s,u)=>s+invVal(u),0)):'Продать всё · '+money(tv)}</button>${PS.length?`<button class="btn sm" onclick="openWallet('wd',{m:'gift',sel:[...PS]})">Вывести в Telegram</button>`:''}</div>`:`<div class="empty-m">Пока пусто. <a href="#/cases" onclick="closeModal()" style="color:var(--ac2);font-weight:700">Открыть кейс</a></div>`}
 <button class="btn sm" style="margin-top:18px;color:var(--rd)" onclick="if(confirm('Сбросить демо-данные?')){localStorage.removeItem('${SK}');localStorage.removeItem('unbattle_v1');location.reload()}">Сбросить демо</button>`}
function togP(u){const i=PS.indexOf(u);i>=0?PS.splice(i,1):PS.push(u);drawProfile()}

/* ================= boot ================= */
chrome();seedFeed();
S.tx.filter(t=>t.st==='pe').forEach(t=>setTimeout(()=>doneTx(t.id),Math.max(500,t.ts+8000-Date.now())));
addEventListener('hashchange',route);route();
addEventListener('pagehide',()=>{runLeave();save()});
(function loop(){setTimeout(()=>{feedTick();loop()},ri(2500,5000))})();
</script>
</body>
